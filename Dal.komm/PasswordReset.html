<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="../CSS/default.css">
    <link rel="stylesheet" href="PasswordReset.css">
    <title>달콤 비밀번호 재설정</title>
</head>
<body>
    <div id="wrap">
        <header>
            <h1>비밀번호 재설정</h1>
            <a href="Login.html" class="prev_btn" aria-label="이전 페이지">
                <img src="img/back_icon.svg?v=3" alt="">
            </a>
        </header>

        <main>
            <section class="password_reset" aria-labelledby="reset-title">
                <h2 id="reset-title">비밀번호 재설정</h2>
                <p class="description">
                    가입하신 이메일을 입력해 주세요.
                </p>

                <form action="">
                    <fieldset>
                        <legend class="sr-only">비밀번호 재설정</legend>

                        <div class="input_box">
                            <label for="email" class="sr-only">아이디(이메일)</label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="아이디(이메일)을 입력해 주세요."
                            >
                        </div>

                        <button type="submit" class="next_btn">다음</button>
                    </fieldset>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
