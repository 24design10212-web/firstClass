<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>달콤리뉴얼포트폴리오</title>
    <link rel="stylesheet" href="../CSS/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js   "></script>
</head>
<body>
    <div id="wrap">
        <header>제목공간</header>
        <main>
            <div class="hero-sec">
                <!-- Slider main container -->
                <div class="swiper">
                <!-- Additional required wrapper -->
                <div class="swiper-wrapper">
                    <!-- Slides -->
                    <div class="swiper-slide">
                        <img src="img/visual01.png" alt="라떼배너" class="pc">
                        <img src="img/m_visual01.png" alt="라떼배너모바일" class="mo">
                    </div>
                    <div class="swiper-slide">
                        <img src="img/visual02.png" alt="여름메뉴배너" class="pc">
                        <img src="img/m_visual02.jpg" alt="여름메뉴배너모바일" class="mo">
                    </div>
                </div>
                <!-- If we need pagination -->
                <div class="swiper-pagination"></div>

                <!-- If we need navigation buttons -->
                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>

                <!-- If we need scrollbar -->
                <div class="swiper-scrollbar"></div>
                </div>
            </div>
        </main>
        <footer>&copy;</footer>
    </div>
    <script>
        const swiper1 = new Swiper('.hero-sec > .swiper', {
        // Optional parameters
        direction: 'horizontal',
        loop: true,

        // If we need pagination
        pagination: {
            el: '.hero-sec .swiper-pagination',
        },

        // Navigation arrows
        navigation: {
            nextEl: '.hero-sec .swiper-button-next',
            prevEl: '.hero-sec .swiper-button-prev',
        },

        // And if we need scrollbar
        scrollbar: {
            el: '.hero-sec .swiper-scrollbar',
        },
        });
    </script>
</body>
</html>
