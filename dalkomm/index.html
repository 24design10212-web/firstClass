<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>달콤리뉴얼포트폴리오</title>
    <link rel="stylesheet" href="../CSS/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header class="site-header">
            <div class="header-inner">
                <a href="#" class="header-logo" aria-label="달콤 홈"><img src="img/BI.svg" alt=""></a>
                <nav class="main-nav" aria-label="주요 메뉴">
                    <a href="#brand">BRAND</a>
                    <a href="#menu">MENU</a>
                    <a href="#store">STORE</a>
                    <a href="#event">EVENT</a>
                    <a href="#news">NEWS</a>
                </nav>
                <a href="#franchise" class="franchise-link">창업안내</a>
            </div>
        </header>
        <main>
            <div class="hero-sec">
                <div class="swiper">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <img src="img/visual01.png" alt="라떼배너" class="pc">
                            <img src="img/m_visual01.png" alt="라떼배너모바일" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual02.png" alt="여름메뉴배너" class="pc">
                            <img src="img/m_visual02.png" alt="여름메뉴배너모바일" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual03.png" alt="반반메뉴배너" class="pc">
                            <img src="img/m_visual03.png" alt="반반메뉴배너모바일" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual04.png" alt="팥빙수메뉴배너" class="pc">
                            <img src="img/m_visual04.png" alt="팥빙수메뉴배너모바일" class="mo">
                        </div>
                    </div>
                </div>
                <div class="hero-controls">
                    <div class="hero-progress" role="progressbar" aria-label="슬라이드 진행 상태" aria-valuemin="1" aria-valuemax="4" aria-valuenow="1">
                        <span class="hero-progress-fill"></span>
                    </div>
                    <div class="hero-arrows">
                        <button type="button" class="hero-prev" aria-label="이전 슬라이드"></button>
                        <button type="button" class="hero-next" aria-label="다음 슬라이드"></button>
                    </div>
                </div>
            </div>
            <!-- Brand section: 메뉴 섹션 위에 배치 -->
            <section class="brand-sec" id="brand" aria-label="달콤 브랜드 소개">
                <article class="brand-panel brand-panel--dalkomm">
                    <div class="brand-panel-inner">
                        <div class="brand-copy">
                            <h2>Dal.Komm</h2>
                            <p class="brand-tagline">달콤, 상상이 일상이 되는 곳</p>
                            <p class="brand-description">엄선한 원두와 균형 잡힌 로스팅으로 일관된 품질을 제공하는<br class="desktop-only"> 프리미엄 커피브랜드입니다.</p>
                            <a class="brand-link" href="https://www.dalkomm.com/" target="_blank" rel="noopener noreferrer">달콤 브랜드 사이트 <span aria-hidden="true">›</span></a>
                        </div>
                        <div class="brand-image">
                            <img src="img/dalkomm1.png" alt="달콤 커피 매장 내부">
                        </div>
                    </div>
                </article>
                <article class="brand-panel brand-panel--dalkomm-n">
                    <div class="brand-panel-inner">
                        <div class="brand-image">
                            <img src="img/dalkommN1.png" alt="달콤N 매장 외관과 베이커리 메뉴">
                        </div>
                        <div class="brand-copy">
                            <h2>Dal.Komm <span class="brand-n">.N</span></h2>
                            <p class="brand-tagline">일상이 에너지를 가볍게 채우는 카페</p>
                            <p class="brand-description">모바일 오더, 테이크아웃 중심의 빠른 서비스와 합리적인 가격으로<br class="desktop-only"> 일상 속에서도 부담 없이 즐기는 카페</p>
                            <a class="brand-link" href="https://www.dalkomm.com/" target="_blank" rel="noopener noreferrer">달콤N 브랜드 사이트 <span aria-hidden="true">›</span></a>
                        </div>
                    </div>
                </article>
            </section>
            <section class="signature-sec" id="menu" aria-labelledby="signature-title">
                <div class="signature-inner">
                    <div class="signature-heading">
                        <h2 id="signature-title">Signature</h2>
                        <p class="signature-description">달콤과 달콤N의 시그니처 메뉴를 한눈에 만나보세요</p>
                    </div>
                    <div class="signature-tabs" role="group" aria-label="브랜드 메뉴 선택">
                        <button type="button" class="signature-tab is-active" data-brand="dalkomm" aria-pressed="true">Dal.komm</button>
                        <button type="button" class="signature-tab" data-brand="dalkomm-n" aria-pressed="false">Dal.komm N</button>
                    </div>
                    <div class="signature-slider-wrap">
                        <button type="button" class="signature-prev" aria-label="이전 시그니처 메뉴"></button>
                        <div class="swiper signature-swiper">
                            <div class="swiper-wrapper"></div>
                        </div>
                        <button type="button" class="signature-next" aria-label="다음 시그니처 메뉴"></button>
                    </div>
                    <p class="signature-card-title" aria-live="polite">큐브라떼</p>
                </div>
            </section>
        </main>
        <footer>&copy;</footer>
    </div>
    <script>
        const progressFill = document.querySelector('.hero-progress-fill');
        const progressBar = document.querySelector('.hero-progress');

        const swiper1 = new Swiper('.hero-sec .swiper', {
            direction: 'horizontal',
            loop: true,
            autoplay: {
                delay: 5000,
                disableOnInteraction: false,
            },
            navigation: {
                nextEl: '.hero-next',
                prevEl: '.hero-prev',
            },
            on: {
                init: function () {
                    updateHeroProgress(this);
                },
                slideChange: function () {
                    updateHeroProgress(this);
                },
            },
        });

        // 저장소에 실제로 등록된 이미지 파일명을 사용합니다.
        const signatureMenus = {
            dalkomm: [
                { file: 'StrawberryCube.png', name: '스트로베리 큐브', alt: '스트로베리 큐브 음료' },
                { file: 'Cube.png', name: '큐브라떼', alt: '큐브라떼' },
                { file: 'HoneyGrapefruit_ice.png', name: '허니 자몽 아이스', alt: '허니 자몽 아이스 음료' },
                { file: 'HoneyCube.png', name: '허니 큐브', alt: '허니 큐브 음료' },
                { file: 'MangoCube.png', name: '망고 큐브', alt: '망고 큐브 음료' },
                { file: 'HoneyGrapefruit .png', name: '허니 자몽', alt: '허니 자몽 음료' },
                { file: 'Grapefruit&Earl greyicedtea.png', name: '자몽 얼그레이 아이스티', alt: '자몽 얼그레이 아이스티' },
                { file: 'Grapefruit&Earlgreytea.png', name: '자몽 얼그레이 티', alt: '자몽 얼그레이 티' },
            ],
            'dalkomm-n': [
                { file: 'a.png', name: '쑥크림 카페라떼', alt: '쑥크림 카페라떼' },
                { file: 'b.png', name: '쑥크림 카페라떼 디카페인', alt: '쑥크림 카페라떼 디카페인' },
                { file: 'c.png', name: '프렌치 바닐라 라떼', alt: '프렌치 바닐라 라떼' },
                { file: 'd.png', name: '숙성라떼', alt: '숙성라떼' },
                { file: 'e.png', name: '체리에이드', alt: '체리에이드' },
                { file: 'f.png', name: '꿀석류차', alt: '꿀석류차' },
            ],
        };

        const signatureWrapper = document.querySelector('.signature-swiper .swiper-wrapper');
        const signatureTitle = document.querySelector('.signature-card-title');
        const signatureTabs = document.querySelectorAll('.signature-tab');
        let signatureSwiper;

        function renderSignatureMenus(brand) {
            const menus = signatureMenus[brand];
            if (signatureSwiper) {
                signatureSwiper.destroy(true, true);
                signatureSwiper = undefined;
                document.querySelector('.signature-swiper').classList.add('swiper');
                signatureWrapper.classList.add('swiper-wrapper');
            }

            signatureWrapper.innerHTML = menus.map(function (menu) {
                // encodeURIComponent는 파일명의 공백과 & 문자를 URL에 맞게 처리합니다.
                const imagePath = 'img/' + encodeURIComponent(menu.file);
                return '<div class="swiper-slide signature-card">' +
                    '<img src="' + imagePath + '" alt="' + menu.alt + '">' +
                    '</div>';
            }).join('');

            signatureSwiper = new Swiper('.signature-swiper', {
                slidesPerView: 3,
                centeredSlides: true,
                initialSlide: brand === 'dalkomm' ? 1 : 0,
                spaceBetween: 0,
                loop: true,
                navigation: {
                    nextEl: '.signature-next',
                    prevEl: '.signature-prev',
                },
                breakpoints: {
                    0: { slidesPerView: 1.8 },
                    600: { slidesPerView: 3 },
                },
                on: {
                    init: function () {
                        updateSignatureTitle(this, brand);
                    },
                    slideChange: function () {
                        updateSignatureTitle(this, brand);
                    },
                },
            });
        }

        function updateSignatureTitle(swiper, brand) {
            const menus = signatureMenus[brand];
            const activeMenu = menus[swiper.realIndex % menus.length];
            signatureTitle.textContent = activeMenu.name;
        }

        signatureTabs.forEach(function (tab) {
            tab.addEventListener('click', function () {
                const brand = tab.dataset.brand;
                signatureTabs.forEach(function (item) {
                    const isActive = item === tab;
                    item.classList.toggle('is-active', isActive);
                    item.setAttribute('aria-pressed', String(isActive));
                });
                renderSignatureMenus(brand);
            });
        });

        renderSignatureMenus('dalkomm');

        function updateHeroProgress(swiper) {
            const duplicateSlides = swiper.el.querySelectorAll('.swiper-slide-duplicate').length;
            const totalSlides = swiper.slides.length - duplicateSlides;
            const currentSlide = swiper.realIndex + 1;
            // 전체 진행 바를 슬라이드 개수만큼 나누고, 검은 표시를 현재 구간으로 이동
            const sectionWidth = 100 / totalSlides;
            const position = (currentSlide - 1) * 100;

            progressFill.style.width = sectionWidth + '%';
            progressFill.style.transform = 'translateX(' + position + '%)';
            progressBar.setAttribute('aria-valuemax', totalSlides);
            progressBar.setAttribute('aria-valuenow', currentSlide);
        }
    </script>
</body>
</html>
