<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>달콤리뉴얼포트폴리오</title>
    <link rel="stylesheet" href="../CSS/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header class="site-header">
            <div class="header-inner">
                <a href="#" class="header-logo" aria-label="달콤 홈"><img src="img/BI.svg" alt=""></a>
                <nav class="main-nav" aria-label="주요 메뉴">
                    <a href="#brand">BRAND</a>
                    <a href="#menu">MENU</a>
                    <a href="#store">STORE</a>
                    <a href="#event">EVENT</a>
                    <a href="#news">NEWS</a>
                </nav>
                <a href="#franchise" class="franchise-link">창업안내</a>
            </div>
        </header>
        <main>
            <div class="hero-sec">
                <div class="swiper">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <img src="img/visual01.png" alt="라떼배너" class="pc">
                            <img src="img/m_visual01.png" alt="라떼배너모바일" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual02.png" alt="여름메뉴배너" class="pc">
                            <img src="img/m_visual02.png" alt="여름메뉴배너모바일" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual03.png" alt="반반메뉴배너" class="pc">
                            <img src="img/m_visual03.png" alt="반반메뉴배너모바일" class="mo">
                        </div>
                    </div>
                </div>
                <div class="hero-controls">
                    <div class="hero-progress" role="progressbar" aria-label="슬라이드 진행 상태" aria-valuemin="1" aria-valuemax="2" aria-valuenow="1">
                        <span class="hero-progress-fill"></span>
                    </div>
                    <div class="hero-arrows">
                        <button type="button" class="hero-prev" aria-label="이전 슬라이드"></button>
                        <button type="button" class="hero-next" aria-label="다음 슬라이드"></button>
                    </div>
                </div>
            </div>
        </main>
        <footer>&copy;</footer>
    </div>
    <script>
        const progressFill = document.querySelector('.hero-progress-fill');
        const progressBar = document.querySelector('.hero-progress');

        const swiper1 = new Swiper('.hero-sec .swiper', {
            direction: 'horizontal',
            loop: true,
            navigation: {
                nextEl: '.hero-next',
                prevEl: '.hero-prev',
            },
            on: {
                init: function () {
                    updateHeroProgress(this);
                },
                slideChange: function () {
                    updateHeroProgress(this);
                },
            },
        });

        function updateHeroProgress(swiper) {
            const duplicateSlides = swiper.el.querySelectorAll('.swiper-slide-duplicate').length;
            const totalSlides = swiper.slides.length - duplicateSlides;
            const currentSlide = swiper.realIndex + 1;
            // 검은 진행 표시의 길이는 고정하고, 현재 슬라이드 위치로 이동
            const position = totalSlides > 1 ? (currentSlide - 1) / (totalSlides - 1) * 100 : 0;

            progressFill.style.width = '50%';
            progressFill.style.transform = 'translateX(' + position + '%)';
            progressBar.setAttribute('aria-valuemax', totalSlides);
            progressBar.setAttribute('aria-valuenow', currentSlide);
        }
    </script>
</body>
</html>
